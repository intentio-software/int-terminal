[package]
name = "int-terminal"
version = "0.1.0"
description = "Intentio Terminal"
authors = ["Intentio Software"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary, which
# otherwise collides on Windows (rust-lang/cargo#8519).
name = "int_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
tauri-plugin-window-state = "2"
base64 = "0.23.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
