<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Shares the palette and rounded square of the Intentio family. The mark is
       a prompt: a chevron and the cursor waiting after it.

       Two shapes only, and heavy ones. A terminal icon wants to be the thing
       you have typed at ten thousand times, and anything finer - a window
       frame, a row of text, a blinking underscore - is grey mush by the time it
       is 16px tall in a dock. The chevron alone reads as "type here" at any
       size. -->

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#062a44"/>

  <!-- The prompt. Off-centre on purpose: a chevron and cursor sitting together
       on the left is how a prompt actually looks, and centring the pair would
       lose that. -->
  <path
    d="M 150 178 L 246 256 L 150 334"
    fill="none"
    stroke="#f05f36"
    stroke-width="46"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- The cursor. A filled block rather than an underscore: it holds its weight
       when the icon is small, and it is what a terminal shows when it is
       waiting for you rather than running something. -->
  <rect x="288" y="296" width="80" height="40" rx="12" fill="#94a9bd"/>
</svg>
